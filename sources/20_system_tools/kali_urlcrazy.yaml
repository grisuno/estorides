name: kali_urlcrazy
enabled: true
category: 20. System Tools (Kali)
description: "urlcrazy -p — typo-domain generation and DNS existence probing via resolvers"
os: linux
kind: system_app
requires_key: false
contact: none
logs_queries: true
parser: urlcrazy_text
entity_hints:
  - domain
applies_to:
  - domain
tool:
  binary: urlcrazy
  args:
    - '-p'
    - '{query}'
  output_format: text
  timeout: 300
