name: kali_whatweb
enabled: true
category: 20. System Tools (Kali)
description: "whatweb — passive web technology fingerprinting (direct HTTP to target)"
os: linux
kind: system_app
requires_key: false
contact: active
logs_queries: true
parser: whatweb_text
entity_hints:
  - url
applies_to:
  - domain
  - url
tool:
  binary: whatweb
  args:
    - '{query}'
  output_format: text
  timeout: 300
