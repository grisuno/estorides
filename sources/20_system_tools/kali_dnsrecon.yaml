name: kali_dnsrecon
enabled: true
category: 20. System Tools (Kali)
description: "dnsrecon -t std — DNS records incl. zone-transfer attempt (touches target nameservers)"
os: linux
kind: system_app
requires_key: false
contact: active
logs_queries: true
parser: dnsrecon_text
entity_hints:
  - domain
  - ipv4
applies_to:
  - domain
tool:
  binary: dnsrecon
  args:
    - '-d'
    - '{query}'
    - '-t'
    - 'std'
  output_format: text
  timeout: 300
