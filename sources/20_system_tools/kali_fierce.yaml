name: kali_fierce
enabled: true
category: 20. System Tools (Kali)
description: "fierce --domain — subdomain discovery incl. zone-transfer attempt (touches target nameservers)"
os: linux
kind: system_app
requires_key: false
contact: active
logs_queries: true
parser: fierce_text
entity_hints:
  - domain
  - ipv4
applies_to:
  - domain
tool:
  binary: fierce
  args:
    - '--domain'
    - '{query}'
    - '--dns-servers'
    - '8.8.8.8'
  output_format: text
  timeout: 300
