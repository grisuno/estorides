name: adsbfi_aircraft_by_hex
enabled: true
category: 21. Aerospace
description: adsb.fi - live ADS-B state for one ICAO 24-bit address (second network)
os: any
requires_key: false
contact: none
parser: adsblol_aircraft
entity_hints:
- aircraft
- icao24
- position
- altitude
- callsign
applies_to:
- mac
- username
- keyword
tool:
  method: GET
  url: https://opendata.adsb.fi/api/v2/hex/{query}
  headers:
    User-Agent: Estorides/1.0 (open-source OSINT tool)
  params: {}
