name: hunter_email
enabled: true
category: 16. People Intelligence
description: "Hunter.io — email addresses associated with a domain (requires API key, free tier: 25 searches/mo)"
os: any
requires_key: true
key_env: HUNTER_API_KEY
contact: none
logs_queries: true
parser: pass_through
entity_hints:
  - email
  - person
  - organization
applies_to:
  - domain
tool:
  method: GET
  url: https://api.hunter.io/v2/domain-search
  headers:
    User-Agent: Estorides/1.0
    Accept: application/json
  params:
    domain: '{query}'
    api_key: '{api_key}'
    limit: '25'
